<!DOCTYPE html>
<html>
<head>
<style>
.slide-in { animation: slideInRight 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
.slide-out { animation: slideOutRight 0.15s cubic-bezier(0.4, 0, 1, 1); }
@keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
@keyframes slideOutRight { from { transform: translateX(0); } to { transform: translateX(100%); } }
</style>
</head>
<body></body>
</html>
