    <script>
        // Start the first Smart News request while the browser is still parsing
        // the page. Returning visitors paint saved cards immediately instead.
        (() => {
            try {
                if (!document.cookie.includes('auth=true')) return;
                if (sessionStorage.getItem('rssAppState') || localStorage.getItem('rssAppState')) return;

                const request = {
                    page: '1',
                    limit: window.innerWidth < 768 ? '15' : '40',
                    filterType: 'smart',
                    filterValue: 'news_vietnam',
                    hideRead: String(localStorage.getItem('hideRead') === 'true'),
                    searchQuery: ''
                };
                const route = location.hash.slice(1).split('?article=')[0].split('/');
                if (route[0] && route[0] !== 'smart') return;
                if (route[1]) {
                    let destination = decodeURIComponent(route[1]).replace(/_(world|foreign)$/, '_global');
                    if (['news', 'finance', 'tech'].includes(destination)) destination += '_global';
                    if (!/^(news|finance|tech)_(vietnam|global)$/.test(destination)) return;
                    request.filterValue = destination;
                }
                request.smartRegion = request.filterValue.endsWith('_vietnam') ? 'vietnam' : 'global';
                request.smartMode = 'top';
                const params = new URLSearchParams(request);
                window.__rssInitialDataRequest = {
                    ...request,
                    promise: fetch(`/api/data?${params.toString()}`, { credentials: 'same-origin' })
                        .then(response => response.ok ? response : null)
                        .catch(() => null)
                };
            } catch (_) {
                // Storage can be disabled in strict privacy modes. The normal
                // The normal request in script.js handles disabled storage.
            }
        })();
    </script>
