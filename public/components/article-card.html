                <template x-for="(article, articleIndex) in displayedArticles" :key="articleRowKey(article, articleIndex)">
                    <div class="article-row" x-show="!isSmartFeedbackHidden(article)" x-transition.opacity.duration.180ms>
                        <div
                            class="story-divider story-divider-outside"
                            x-show="usesTopStories && !article.topStory?.isTop && (articleIndex === 0 || displayedArticles[articleIndex - 1]?.topStory?.isTop)">
                            More stories
                        </div>

                        <div class="article-card mb-4 md:mb-5 relative overflow-hidden bg-[#111827] rounded-2xl cursor-pointer group border border-white/5 hover:border-white/20 transition-all duration-300 shadow-lg"
                            :class="[
                                (isMobile && mobileActiveCard === article.link) ? 'ring-2 ring-emerald-500' : '',
                                readStates.has(article.link) ? 'is-read' : '',
                                'has-story-briefing',
                            selectedFilterType === 'smart' && smartTabMode === 'classic' ? 'is-smart-classic-card' : '',
                            selectedFilterType !== 'smart' ? 'is-standard-card' : ''
                            ]"
                            :data-smart-cluster-id="usesTopStories ? (article.clusterId || article.link || '') : ''"
                            :data-image-layout="usesTopStories ? 'top' : 'standard'"
                            :data-smart-card-page="Math.floor(articleIndex / (isMobile ? 15 : 40)) + 1"
                            @click="handleCardClick(article, $event)">

                        <!-- reader:include smart/feedback-button -->
                        <div class="card-ambient" aria-hidden="true"></div>
                        <div class="article-card-header">
                        <span class="story-rank" x-show="usesTopStories && article.topStory?.isTop" x-text="'#' + article.topStory?.rank"></span>
                        
                        <!-- Background Image with Gradient Overlay -->
                        <div class="article-card-image absolute inset-y-0 right-0 w-[55%] md:w-[50%] z-0">
                            <img class="thumbnail-soft" alt="" aria-hidden="true" loading="lazy" decoding="async">
                            <div class="thumbnail-plate">
                            <img :data-thumbnail-src="proxyImageUrl(article.image || '/public/default.jpg')"
                                @error="nextStoryImage($event, article)" loading="lazy" decoding="async"
                                :alt="stripHtml(article.title)" referrerpolicy="no-referrer" class="thumbnail-img w-full h-full object-cover">
                            </div>
                        </div>

                        <!-- v3.2.10 — compact Full Coverage at top-right -->
                        <div
                            class="story-coverage-orbs"
                            x-show="selectedFilterType === 'smart' && storyCoverage(article).length > 1"
                            @click.stop
                            aria-label="Full coverage publishers">

                            <template
                                x-for="publisher in storyCoverage(article).slice(0, 4)"
                                :key="publisher.identity">

                                <a
                                    class="story-coverage-orb"
                                    :href="publisher.articles[0]?.link"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    @click.stop
                                    :title="publisher.name + (publisher.articles.length > 1 ? ' · ' + publisher.articles.length + ' reports' : '')">

                                    <span
                                        class="story-coverage-orb-fallback"
                                        x-text="publisher.name?.slice(0, 1)?.toUpperCase() || '?'">
                                    </span>

                                    <img
                                        x-show="publisher.icon"
                                        :src="publisher.icon"
                                        referrerpolicy="no-referrer"
                                        loading="lazy"
                                        @error="$el.style.display='none'"
                                        alt="">
                                </a>
                            </template>

                            <button
                                type="button"
                                class="story-coverage-orb story-coverage-more"
                                x-show="storyCoverage(article).length > 4"
                                @click.stop="toggleStoryCoverage(article)"
                                :aria-expanded="!!storyCoverageOpen[article.clusterId || article.link]"
                                :title="'Show ' + (storyCoverage(article).length - 4) + ' more publishers'"
                                x-text="'+' + (storyCoverage(article).length - 4)">
                            </button>
                        </div>

                        <!-- Content over background -->
                        <div
                            class="article-card-heading relative z-10 flex flex-col p-4 md:p-8 w-[65%] md:w-[65%] min-w-0 overflow-hidden min-h-[180px] md:min-h-[220px] justify-center">
                            <div
                                class="article-metadata flex items-center gap-1.5 md:gap-2 text-[10px] md:text-[11px] font-bold tracking-wider mb-2.5 md:mb-4 uppercase">
                                <span
                                    class="flex items-center gap-1.5 md:gap-2 bg-[#0B101E]/90 px-2 py-1 md:px-2.5 md:py-1 rounded-md text-emerald-400 border border-emerald-500/10">
                                    <img :src="article.feedIcon || smartSourceIcon({ domain: new URL(article.link).hostname })"
                                        class="w-3.5 h-3.5 md:w-4 md:h-4 rounded" @error="$el.style.display='none'"
                                        referrerpolicy="no-referrer">
                                    <span x-text="stripHtml(article.feedTitle)"
                                        class="truncate max-w-[80px] md:max-w-none"></span>
                                </span>
                                <template x-if="article.primarySource && article.primarySource.domain">
                                    <a :href="article.primarySource.url || article.primaryArticleUrl" target="_blank"
                                        rel="noopener noreferrer" @click.stop
                                        class="article-primary-source-badge flex items-center gap-1.5 px-2 py-1 rounded-md no-underline"
                                        :title="'Main article from ' + (article.primarySource.name || article.primarySource.domain)">
                                        <img :src="article.primarySource.icon || smartSourceIcon({ domain: article.primarySource.domain })"
                                            class="w-3.5 h-3.5 md:w-4 md:h-4 rounded" @error="$el.style.display='none'"
                                            referrerpolicy="no-referrer">
                                        <span x-text="article.primarySource.name || article.primarySource.domain"
                                            class="truncate max-w-[78px] md:max-w-[120px]"></span>
                                    </a>
                                </template>
                                <span class="text-white/20 hidden md:inline">•</span>
                                <span class="text-gray-400 whitespace-nowrap" :title="cardSourceTime(article, true)"
                                    x-text="article.publicationTimeReliable === false ? 'Time unavailable' : cardSourceTime(article)"></span>
                                <button x-show="cacheMember(article)" class="cache-status-chip" :class="{ 'is-paused': !cacheMember(article)?.active_caching, 'is-live': cacheMember(article)?.active_caching && !cacheMember(article)?.source_removed && cacheMember(article)?.sync_status !== 'incomplete' }" @click.stop="setCacheActive(article)" :title="cacheBadgeTitle(article)" :aria-label="cacheMember(article)?.active_caching ? 'Pause active caching' : 'Resume caching'">
                                    <span aria-hidden="true" x-text="cacheMember(article)?.active_caching ? '●' : '⏸'"></span><span x-text="cacheBadgeText(article)"></span>
                                </button>
                                <span x-show="cacheMember(article)" class="text-xs text-gray-400" x-text="cacheLastSuccessText(article)"></span>
                                <template x-if="article.isCluster">
                                    <div class="flex items-center gap-1.5 md:gap-2 ml-1"
                                        :title="(article.sources || []).join(', ')">
                                        <span x-show="!usesTopStories || Number(article.sourceCount) > 1" class="text-white/20 hidden md:inline">•</span>
                                        <span x-show="!usesTopStories" class="flex items-center gap-1 text-orange-300 whitespace-nowrap">
                                            <span>🔥</span><span x-text="article.hotness"></span>
                                        </span>
                                        <span x-show="Number(article.sourceCount) > 1" class="flex items-center gap-1 text-cyan-300 whitespace-nowrap">
                                            <span x-text="article.sourceCount"></span><span
                                                x-text="article.sourceCount === 1 ? 'source' : 'sources'"></span>
                                        </span>
                                    </div>
                                </template>
                                <template
                                    x-if="['hot_today', 'hot_week', 'views_today', 'views_week'].includes(selectedFilterType)">
                                    <div class="flex items-center gap-1.5 md:gap-2 ml-1">
                                        <span class="text-white/20 hidden md:inline">•</span>
                                        <span class="flex items-center gap-1 text-orange-400 font-bold" :title="isMobile ? '' : 'Replies'">
                                            <svg class="w-3 h-3 md:w-3.5 md:h-3.5" fill="none" stroke="currentColor"
                                                viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                                                </path>
                                            </svg>
                                            <span x-text="formatCount(article.replyCount || 0)"></span>
                                        </span>
                                        <span class="text-white/20 hidden md:inline">•</span>
                                        <span class="flex items-center gap-1 text-blue-400 font-bold" :title="isMobile ? '' : 'Views'">
                                            <svg class="w-3 h-3 md:w-3.5 md:h-3.5" fill="none" stroke="currentColor"
                                                viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                                                </path>
                                            </svg>
                                            <span x-text="formatCount(article.viewCount || 0)"></span>
                                        </span>
                                    </div>
                                </template>

                            </div>
                                <div data-tooltip-trigger
                                     @pointerenter="showTooltip($event, stripHtml(article.title), stripHtml(article.content))"
                                     @pointermove="moveTooltip($event)"
                                     @pointerleave="hideTooltip()"
                                     @pointercancel="hideTooltip()"
                                     @focusout="hideTooltip()"
                                     @touchstart.passive="hideTooltip()">
                                    <h2 class="text-[17px] md:text-[26px] font-extrabold text-white leading-tight md:leading-tight mb-2 md:mb-3 pr-2 md:pr-4 line-clamp-2 break-words"
                                        x-text="stripHtml(article.title)"></h2>
                                    <p class="text-[13px] md:text-[14px] text-gray-300 line-clamp-2 md:line-clamp-2 pr-2 md:pr-4 leading-snug md:leading-relaxed break-words"
                                        x-text="usesTopStories ? storyExcerpt(article) : stripHtml(article.content)"></p>
                                </div>

                        </div>

                        <div class="article-entity-row" x-show="theme === 'glass-light' && (article.entity?.name || (typeof article.entity === 'string' && article.entity))">
                            <span class="article-entity-chip" x-text="article.entity?.name || article.entity || ''"></span>
                        </div>
                        </div>

                        <template x-if="usesTopStories || (selectedFilterType === 'smart' && smartTabMode === 'classic' && storyCoverage(article).length > 4)">
<!-- reader:include article/card-panel -->
                        </template>
                        <div class="article-actions-overlay absolute right-4 items-center gap-1.5 p-1.5 rounded-xl border shadow-xl flex-wrap justify-end z-20"
                            :class="[(isMobile && mobileActiveCard === article.link) ? 'flex bottom-4 max-w-[85%]' : 'top-1/2 -translate-y-1/2 hidden md:group-hover:flex', theme === 'glass-light' ? 'bg-white/95 border-gray-200 shadow-[0_4px_24px_rgba(0,0,0,0.15)] backdrop-blur-xl' : 'bg-[#111827] border-white/10']">

                            <button @click.stop="toggleState('hiddenStates', article.link)"
                                class="transition p-1.5 rounded-lg"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : (hiddenStates.includes(article.link) ? 'Unhide Article' : 'Hide Article')">
                                <svg class="w-4 h-4 md:w-5 md:h-5"
                                    :class="hiddenStates.includes(article.link) ? 'text-red-500' : 'text-gray-400'"
                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21">
                                    </path>
                                </svg>
                            </button>
                            <button @click.stop="toggleState('savedStates', article.link)"
                                class="transition p-1.5 rounded-lg"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : (savedStates.includes(article.link) ? 'Remove from Read Later' : 'Read Later')">
                                <svg class="w-4 h-4 md:w-5 md:h-5 transition-colors"
                                    :class="savedStates.includes(article.link) ? (theme === 'glass-light' ? 'fill-blue-100 text-blue-600' : 'fill-blue-900/50 text-blue-500') : 'currentColor'"
                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path>
                                </svg>
                            </button>
                            <button @click.stop="openBoardModal(article)"
                                class="transition p-1.5 rounded-lg"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : (isOnBoard(article) ? 'Remove from Board' : 'Save to Board')">
                                <svg class="w-4 h-4 md:w-5 md:h-5 transition-colors"
                                    :class="isOnBoard(article) ? (theme === 'glass-light' ? 'fill-yellow-100 text-yellow-600' : 'fill-yellow-900/50 text-yellow-500') : 'currentColor'"
                                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z">
                                    </path>
                                </svg>
                            </button>
                            <button @click.stop="toggleState('readStates', article.link)"
                                class="transition p-1.5 rounded-lg"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : (readStates.has(article.link) ? 'Keep unread' : 'Mark as read')">
                                <svg class="w-4 h-4 md:w-5 md:h-5 text-gray-400"
                                    :class="readStates.has(article.link) ? 'text-emerald-500' : ''" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M5 13l4 4L19 7"></path>
                                </svg>
                            </button>
                            <button
                                @click.stop.prevent="navigator.clipboard.writeText(article.link); let btn = $event.currentTarget; let orig = btn.innerHTML; btn.innerHTML = '<svg class=\'w-4 h-4 md:w-5 md:h-5 text-emerald-400\' fill=\'none\' stroke=\'currentColor\' viewBox=\'0 0 24 24\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M5 13l4 4L19 7\'></path></svg>'; setTimeout(() => btn.innerHTML = orig, 1000);"
                                class="transition p-1.5 rounded-lg"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : 'Copy Link'">
                                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1">
                                    </path>
                                </svg>
                            </button>
                            <button @click.stop="openDebugModal(article.link)"
                                class="transition p-1.5 rounded-lg hidden lg:block"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : 'Debug Extraction'">
                                <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                                </svg>
                            </button>
                            <button x-show="isMobile" @click.stop="mobileActiveCard = null"
                                class="transition p-1.5 rounded-lg text-gray-400 ml-1"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>
                            <a :href="articleSourceUrl(article)" target="_blank" rel="noopener noreferrer" @click.stop="hideTooltip()"
                                class="transition p-1.5 rounded-lg ml-1"
                                :class="theme === 'glass-light' ? 'hover:bg-black/5 text-gray-500 hover:text-gray-800' : 'hover:bg-white/10 text-gray-400'"
                                :title="isMobile ? '' : 'Open on original site'">
                                <svg class="w-4 h-4 md:w-5 md:h-5 transform -rotate-45" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                    </div>
                </template>
