        <header
            class="border-b border-white/5 flex flex-col px-4 md:px-6 py-4 flex-shrink-0 bg-[#0B101E] z-10 gap-3 transition-all duration-300">
            <div class="flex flex-row items-center justify-between w-full min-w-0 gap-2 md:gap-4">
                <div class="flex items-center gap-2 md:gap-4 min-w-0 flex-1">
                    <button @click="toggleSidebar()"
                        class="md:hidden w-8 h-8 rounded-lg text-gray-400 hover:bg-white/10 hover:text-white flex-shrink-0 flex items-center justify-center transition-all -ml-1"
                        :aria-expanded="mobileSidebarOpen"
                        :aria-label="mobileSidebarOpen ? 'Close sidebar' : 'Open sidebar'"
                        :title="mobileSidebarOpen ? 'Close sidebar' : 'Open sidebar'">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                :d="mobileSidebarOpen ? 'M6 18 18 6M6 6l12 12' : 'M4 6h16M4 12h16M4 18h16'"></path>
                        </svg>
                    </button>

                    <div class="min-w-0 flex-1">
                        <h1 class="text-lg md:text-3xl font-extrabold transition truncate flex items-center gap-1.5 md:gap-2"
                            :class="theme === 'glass-light' ? 'text-slate-900' : 'text-white'">
                            <span x-text="headerTitle" class="truncate"></span>
                            
                            <select x-show="selectedFilterType === 'board' && userPreferences.boardFolders?.length > 0"
                                x-model="selectedFilterValue"
                                @change="setFilter('board', selectedFilterValue || null)"
                                class="ml-2 text-sm bg-transparent hover:bg-white/5 border border-white/20 rounded-lg px-2 py-1 outline-none transition cursor-pointer"
                                :class="theme === 'glass-light' ? 'text-emerald-700 border-black/10 hover:bg-black/5 bg-transparent' : 'text-emerald-400 border-white/20 hover:bg-white/5'">
                                <option value="" class="bg-[#111827] text-white">All Folders</option>
                                <template x-for="folder in userPreferences.boardFolders" :key="folder">
                                    <option :value="folder" x-text="folder" class="bg-[#111827] text-white"></option>
                                </template>
                            </select>
                            <button x-show="selectedFilterType === 'board'" class="cache-settings-button" @click="openCacheRules()" title="Auto Cache Rules" aria-label="Auto Cache Rules"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg></button>
                        </h1>

                    </div>
                </div>

                <div class="flex items-center gap-1 md:gap-3 w-auto text-gray-400 flex-shrink-0">
                    <div class="relative flex items-center transition-all duration-300 group rounded-full border border-white/10 bg-[#111827] h-8 md:h-9"
                        x-data="{ searchFocused: false }"
                        :class="searchQuery || searchFocused ? 'w-40 sm:w-48 lg:w-80 shadow-inner' : 'w-8 sm:w-48 lg:w-80 sm:shadow-inner'">

                        <!-- Icon Container to ensure perfect optical centering -->
                        <div class="absolute left-0 top-0 h-full flex items-center justify-center transition-all duration-300 pointer-events-none"
                            :class="searchQuery || searchFocused ? 'w-10 sm:w-11' : 'w-8 sm:w-11'">
                            <svg class="w-4 h-4 transition-colors"
                                :class="searchFocused ? 'text-emerald-400' : 'text-gray-500'" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>

                        <input type="text" x-model="searchQuery" @input.debounce.500ms="fetchData()"
                            @focus="searchFocused = true" @blur="searchFocused = false"
                            :placeholder="(searchQuery || searchFocused || !isMobile) ? 'Search...' : ''"
                            class="w-full h-full bg-transparent text-[13px] md:text-sm text-gray-200 pr-2 sm:pr-12 rounded-full focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-all cursor-pointer focus:cursor-text sm:cursor-text"
                            :class="searchQuery || searchFocused || !isMobile ? 'pl-9 sm:pl-10 placeholder-gray-600' : 'pl-8 sm:pl-10 placeholder-transparent'">

                        <div
                            class="hidden sm:flex absolute right-3 top-1/2 transform -translate-y-1/2 items-center pointer-events-none">
                            <span
                                class="text-[10px] font-mono text-gray-500 border border-white/10 rounded px-1.5 py-0.5 bg-[#0B101E]">⌘K</span>
                        </div>
                    </div>

                    <button x-show="selectedFilterType !== 'recent'"
                        @click="toggleHideRead()"
                        class="hover:text-white transition h-8 w-8 md:h-9 md:w-9 flex items-center justify-center rounded-full border border-white/10 bg-[#111827] flex-shrink-0"
                        :class="hideRead ? 'text-emerald-400 border-emerald-500/30' : ''" title="Hide Read Articles">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="!hideRead" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path x-show="!hideRead" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            <path x-show="hideRead" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                    </button>

                    <button @click="markAllUndo ? undoMarkAllRead() : markAllAsRead()"
                        class="hidden md:flex hover:text-white transition items-center gap-2 text-sm font-medium px-3 h-8 md:h-9 rounded-full border bg-[#111827] flex-shrink-0"
                        :class="markAllUndo ? 'text-amber-300 border-amber-400/30' : 'border-white/10'"
                        :title="markAllUndo ? 'Undo mark all read' : 'Mark all displayed as read'">
                        <svg class="w-4 h-4" :class="markAllUndo ? 'text-amber-300' : 'text-emerald-400'" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path x-show="!markAllUndo" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 13l4 4L19 7"></path>
                            <path x-show="markAllUndo" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 10h11a4 4 0 010 8H9m-6-8l4-4m-4 4l4 4"></path>
                        </svg>
                        <span class="hidden xl:inline" x-text="markAllUndo ? 'Undo' : 'Mark All Read'"></span>
                    </button>

                    <button
                        @click="cycleTheme()"
                        class="hover:text-white transition h-8 w-8 md:h-9 md:w-9 flex items-center justify-center rounded-full border border-white/10 bg-[#111827] flex-shrink-0"
                        title="Toggle Theme (Classic -> Dark Glass -> Light Glass)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <!-- Classic -> Dark Glass -> Light Glass icons -->
                            <path x-show="theme === 'classic'" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                            <path x-show="theme === 'glass'" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"
                                d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                            <path x-show="theme === 'glass-light'" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                    </button>

                    <button @click="syncNow()"
                        class="hover:text-white transition h-8 w-8 md:h-9 md:w-9 flex items-center justify-center rounded-full border border-white/10 bg-[#111827] flex-shrink-0"
                        :class="isSyncing ? 'animate-spin text-emerald-400 border-emerald-500/30' : ''" title="Refresh">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

<!-- reader:include smart/navigation -->
        </header>
