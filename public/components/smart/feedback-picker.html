<div x-init="$watch('selectedFilterType', () => feedbackContextChanged()); $watch('selectedFilterValue', () => feedbackContextChanged())">
    <div class="smart-feedback-backdrop" x-show="feedbackSession" x-cloak @click.self="cancelSmartFeedback()" @keydown.escape.window="if (feedbackSession) cancelSmartFeedback()">
        <section id="smart-feedback-picker" class="smart-glass-panel smart-feedback-picker" role="dialog" aria-modal="true" aria-labelledby="feedback-heading" aria-describedby="feedback-article"
            :style="feedbackPosition" @keydown="trapFeedbackFocus($event)" x-transition.opacity.duration.140ms>
            <h2 id="feedback-heading">Hide stories like this</h2>
            <p id="feedback-article" class="feedback-article" x-text="stripHtml(feedbackSession?.article?.title || '')"></p>
            <p class="feedback-help">Choose words or phrases to add to Content filters. Matching articles will be hidden.</p>
            <div class="feedback-reasons" role="group" aria-label="Suggested words and phrases" :aria-busy="feedbackSession?.loading || false">
                <p class="feedback-loading" x-show="feedbackSession?.loading" role="status">Finding keywords…</p>
                <template x-for="chip in feedbackSession?.chips || []" :key="chip.keyword">
                    <span class="feedback-chip-wrap" :class="{ 'is-typed': chip.typed }">
                        <button type="button" class="feedback-chip" :aria-pressed="chip.selected" :disabled="!!feedbackBusy"
                            @click="toggleFeedbackChip(chip)" x-text="chip.keyword"></button>
                        <button type="button" class="feedback-chip-remove" x-show="chip.typed" :disabled="!!feedbackBusy"
                            @click="removeFeedbackChip(chip)" :aria-label="'Remove ' + chip.keyword">×</button>
                    </span>
                </template>
            </div>
            <div class="feedback-add">
                <label for="feedback-text" class="feedback-add-label">Add your own word or phrase</label>
                <div class="feedback-add-row">
                    <input id="feedback-text" class="feedback-input" type="text" maxlength="200" autocomplete="off" enterkeyhint="done"
                        placeholder="Type a word or phrase, then press Enter" :disabled="!!feedbackBusy"
                        :value="feedbackSession?.input || ''" @input="feedbackSession.input = $event.target.value" @keydown="onFeedbackInputKeydown($event)">
                    <button type="button" :disabled="!!feedbackBusy || !(feedbackSession?.input || '').trim()" @click="addFeedbackInput()">Add</button>
                </div>
            </div>
            <p class="feedback-preview" x-show="feedbackPreviewText" x-text="feedbackPreviewText" role="status" aria-live="polite"></p>
            <p role="status" aria-live="polite" class="feedback-status" x-text="feedbackMessage"></p>
            <footer class="feedback-footer">
                <button type="button" @click="cancelSmartFeedback()" :disabled="feedbackBusy === 'apply'">Cancel</button>
                <button type="button" class="feedback-apply" :disabled="!!feedbackBusy" @click="confirmSmartFeedback()" x-text="feedbackConfirmLabel"></button>
            </footer>
        </section>
    </div>
    <aside class="smart-feedback-toast smart-glass-panel" x-show="feedbackToast" x-cloak role="status" aria-live="polite">
        <p x-text="feedbackToast?.message"></p>
        <div><button type="button" :disabled="!!feedbackBusy" @click="undoSmartFeedback()">Undo</button><button type="button" x-show="feedbackToast?.kind === 'keywords'" @click="manageContentFilters()">Content filters</button><button type="button" @click="dismissFeedbackToast()" aria-label="Dismiss notification">×</button></div>
        <p x-show="feedbackMessage && !feedbackSession" x-text="feedbackMessage"></p>
    </aside>
</div>
