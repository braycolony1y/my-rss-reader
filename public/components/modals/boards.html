    <!-- BOARD FOLDERS MODAL -->
    <div x-show="boardModalOpen" x-cloak
        class="fixed inset-0 flex items-center justify-center p-4 transition-all duration-300"
        style="z-index: 100;"
        :class="theme === 'glass-light' ? 'bg-white/30 backdrop-blur-md' : 'bg-[#0B101E]/80 backdrop-blur-sm'">
        <div class="rounded-xl w-full max-w-md flex flex-col overflow-hidden shadow-2xl border"
            :class="theme === 'glass-light' ? 'bg-white/70 border-white/60 shadow-[0_16px_48px_rgba(0,0,0,0.1)] backdrop-blur-xl text-slate-800' : 'bg-[#0B101E] border-[#333] text-gray-200'"
            @click.outside="if (!boardSavePending) boardModalOpen = false">
            <div class="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" :class="theme === 'glass-light' ? 'border-black/5' : 'border-[#333]'">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                    Save to Board
                </h2>
                <button @click="boardModalOpen = false" :disabled="boardSavePending" class="transition" :class="theme === 'glass-light' ? 'text-slate-400 hover:text-slate-800' : 'text-gray-400 hover:text-white'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-5 flex flex-col gap-4 overflow-y-auto max-h-[60vh]">
                <div x-show="userPreferences.boardFolders && userPreferences.boardFolders.length > 0">
                    <p class="text-sm font-medium mb-2 opacity-70">Save to existing folder:</p>
                    <div class="grid grid-cols-1 gap-2">
                        <template x-for="folder in userPreferences.boardFolders" :key="folder">
                            <button type="button" @click="assignBoardFolder(folder)" :disabled="boardSavePending" :aria-busy="boardSavePending && boardSavingFolder === folder"
                                class="flex items-center justify-between px-4 py-2.5 rounded-lg border transition hover:scale-[1.02]"
                                :class="(boardFolderFor(boardModalArticle) === folder) ? (theme === 'glass-light' ? 'border-yellow-400 bg-yellow-50 text-yellow-800 font-bold' : 'border-yellow-500 bg-yellow-500/10 text-yellow-400 font-bold') : (theme === 'glass-light' ? 'border-black/5 hover:bg-black/5' : 'border-white/10 hover:bg-white/5')">
                                <span class="flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                                    <span x-text="boardSavePending && boardSavingFolder === folder ? 'Saving…' : folder"></span>
                                </span>
                                <svg x-show="boardFolderFor(boardModalArticle) === folder" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                        </template>
                    </div>
                </div>
                <div>
                    <p class="text-sm font-medium mb-2 opacity-70">Or create a new folder:</p>
                    <div class="flex items-stretch gap-2">
                        <input type="text" x-model="newBoardFolderName" @keydown.enter="createNewBoardFolder()" placeholder="Folder name..."
                            class="flex-1 min-w-0 h-10 px-4 py-2 rounded-lg border focus:ring-2 focus:outline-none transition"
                            :class="theme === 'glass-light' ? 'bg-white/50 border-black/10 focus:border-emerald-500 focus:ring-emerald-500/20 placeholder-slate-400' : 'bg-black/20 border-white/10 focus:border-emerald-500 focus:ring-emerald-500/20 text-white placeholder-gray-500'">
                        <button @click="createNewBoardFolder()" :disabled="boardSavePending || !newBoardFolderName.trim()"
                            class="h-10 shrink-0 px-4 py-2 rounded-lg font-bold transition disabled:cursor-not-allowed"
                            :class="boardSavePending || !newBoardFolderName.trim() ? (theme === 'glass-light' ? 'bg-slate-100 text-slate-400' : 'bg-white/5 text-gray-500') : (theme === 'glass-light' ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-emerald-500 hover:bg-emerald-600 text-white')">
                            Add
                        </button>
                    </div>
                </div>
            </div>
            <p x-show="cacheNotice" x-text="cacheNotice" role="alert" class="px-5 pb-3 text-sm text-red-500"></p>
            <div class="p-4 border-t flex items-center gap-3 justify-end" :class="theme === 'glass-light' ? 'bg-slate-50/50 border-black/5' : 'bg-black/20 border-[#333]'">
                <button x-show="isOnBoard(boardModalArticle)"
                    @click="removeArticleFromBoard()" :disabled="boardSavePending" :aria-busy="boardSavePending && boardSavingFolder === null"
                    class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition mr-auto disabled:cursor-wait"
                    :class="theme === 'glass-light' ? 'text-red-600 hover:bg-red-50' : 'text-red-400 hover:bg-red-500/10'">
                    <svg x-show="boardSavePending && boardSavingFolder === null" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                    <span x-text="boardSavePending && boardSavingFolder === null ? 'Removing…' : 'Remove from Board'"></span>
                </button>
                <button @click="boardModalOpen = false" :disabled="boardSavePending"
                    class="px-4 py-2 rounded-lg text-sm font-medium transition"
                    :class="theme === 'glass-light' ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-emerald-500 hover:bg-emerald-600 text-white'">
                    Done
                </button>
            </div>
        </div>
    </div>
