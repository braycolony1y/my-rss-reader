    <!-- Add Feed Modal -->
    <div x-show="showAddFeedModal" x-cloak
        class="fixed inset-0 bg-[#0B101E]/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#111827] p-6 rounded-2xl max-w-sm w-full border border-white/10 shadow-2xl relative overflow-hidden"
            @click.outside="showAddFeedModal = false">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-teal-500"></div>
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                    </svg>
                    New Feed
                </h2>
                <button @click="showAddFeedModal = false" class="text-gray-500 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Feed URL</label>
            <input type="url" x-model="newFeedUrl" placeholder="Paste RSS or Website URL..."
                class="w-full bg-[#0B101E] border border-white/10 text-white text-sm px-4 py-3 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none mb-4 transition shadow-inner">

            <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Category</label>
            <select x-model="selectedDropdownCategory"
                class="w-full bg-[#0B101E] border border-white/10 text-white text-sm px-4 py-3 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 outline-none mb-3 transition shadow-inner appearance-none cursor-pointer">
                <option value="" class="text-gray-500">Select Category...</option>
                <template x-for="category in categories" :key="category.name">
                    <option :value="category.name" x-text="category.name"></option>
                </template>
                <option value="CREATE_NEW" class="text-emerald-400 font-bold">+ Create New Category...</option>
            </select>

            <div x-show="selectedDropdownCategory === 'CREATE_NEW'" x-transition class="mb-4">
                <input type="text" x-model="newFeedCategory" placeholder="Enter New Category Name"
                    class="w-full bg-[#0B101E] border border-emerald-500/50 text-white text-sm px-4 py-3 rounded-xl focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 outline-none transition shadow-[0_0_10px_rgba(16,185,129,0.1)]">
            </div>

            <div class="mb-4 mt-2">
                <label class="flex items-center text-sm text-gray-300 cursor-pointer">
                    <input type="checkbox" x-model="newFeedExcludeFromSmart" class="mr-2 rounded bg-[#1e1e1e] border-[#444] text-emerald-500 focus:ring-emerald-500">
                    Exclude from Smart News clustering
                </label>
            </div>

            <button @click="addFeed(); if(!isAdding) showAddFeedModal = false;"
                class="w-full mt-2 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-[#0B101E] py-3 rounded-xl text-sm font-bold shadow-[0_4px_15px_rgba(16,185,129,0.3)] transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                :disabled="isAdding || !newFeedUrl.trim()">
                <svg x-show="isAdding" class="animate-spin -ml-1 mr-2 h-4 w-4 text-[#0B101E]"
                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span x-text="isAdding ? 'Adding Feed...' : 'Add Feed'"></span>
            </button>
        </div>
    </div>
