                                            x-text="articleFetchStrategyLabel(strategy)"></span>
                                        <span x-show="overlayRejectedStrategies.includes(strategy)"
                                            class="block text-[10px] text-amber-300/70 mt-0.5">Rejected for this article
                                            · still available to compare</span>
                                    </button>
                                    <button @click="setArticleFetchPreference(strategy, 'like')"
                                        class="p-1.5 rounded-lg transition"
                                        :class="overlayMethodPreferences[strategy] === 'like' ? 'text-emerald-300 bg-emerald-500/15' : 'text-gray-600 hover:text-emerald-300 hover:bg-white/5'"
                                        :aria-label="'Prefer ' + articleFetchStrategyLabel(strategy)"
                                        title="Prefer this method for this publisher">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 001.94-1.515l1.5-6A2 2 0 0019.78 12H15M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3">
                                            </path>
                                        </svg>
                                    </button>
                                    <button @click="setArticleFetchPreference(strategy, 'dislike')"
                                        class="p-1.5 rounded-lg transition"
                                        :class="overlayMethodPreferences[strategy] === 'dislike' ? 'text-red-300 bg-red-500/15' : 'text-gray-600 hover:text-red-300 hover:bg-white/5'"
                                        :aria-label="'Avoid ' + articleFetchStrategyLabel(strategy)"
                                        title="Avoid this method for this publisher">
                                        <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor"
                                            viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 001.94-1.515l1.5-6A2 2 0 0019.78 12H15M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3">
                                            </path>
                                        </svg>
                                    </button>
                                </div>
                            </template>
                        </div>
                        <p x-show="overlayMethodError" x-text="overlayMethodError"
                            class="text-[11px] text-red-300 mt-2"></p>
                        <p class="text-[10px] text-gray-700 mt-2">Like or dislike changes the method order only for this
                            publisher.</p>
                    </div>

                </div>
            </div>
        </div>
    </div>
