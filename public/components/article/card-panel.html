                        <div class="article-card-panel"
                            :data-expanded="(usesTopStories ? true : !!storyCoverageOpen[article.clusterId || article.link]) ? 'true' : 'false'">
                        <div class="article-panel-content" :inert="theme === 'glass-light' && (usesTopStories ? false : !storyCoverageOpen[article.clusterId || article.link])">
                        <div :id="'article-panel-' + articleIndex" class="article-briefing" @click.stop>

                        <!-- v3.2.11a — Classic Full Coverage expansion -->
                        <template
                            x-if="selectedFilterType === 'smart'
                                && smartTabMode === 'classic'
                                && (theme === 'glass-light' || storyCoverageOpen[article.clusterId || article.link])
                                && storyCoverage(article).length > 4">

                            <div
                                class="story-coverage-expanded story-coverage-classic-popover"
                                @click.stop>

                                <template
                                    x-for="publisher in storyCoverage(article).slice(4)"
                                    :key="publisher.identity">

                                    <div class="story-coverage-expanded-publisher">

                                        <div class="story-coverage-expanded-heading">
                                            <span class="story-coverage-expanded-icon">
                                                <span
                                                    x-text="publisher.name?.slice(0, 1)?.toUpperCase() || '?'">
                                                </span>

                                                <img
                                                    x-show="publisher.icon"
                                                    :src="publisher.icon"
                                                    @error="$el.style.display='none'"
                                                    referrerpolicy="no-referrer"
                                                    alt="">
                                            </span>

                                            <strong x-text="publisher.name"></strong>
                                        </div>

                                        <template
                                            x-for="source in publisher.articles"
                                            :key="source.link">

                                            <a
                                                :href="source.link"
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                @click.stop
                                                x-text="stripHtml(source.title)">
                                            </a>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <div class="article-top-story-content" x-show="usesTopStories">

                            <p
                                class="story-freshness"
                                x-show="briefingFor(article).status === 'stale' && !briefingFor(article).analysisStatus"
                                x-text="article.topStory?.feed?.endsWith('_vietnam') ? 'Bản tóm tắt trước · đang cập nhật theo diễn biến mới' : 'Previous briefing · updating with newer reporting'">
                            </p>

                            <p
                                class="story-freshness"
                                x-show="article.topStory?.timeline?.length > 1"
                                x-text="'Updated ' + timeAgo(article.topStory?.latest_material_update) + ' · First reported ' + timeAgo(article.topStory?.timeline?.[0]?.date)">
                            </p>

                            <p
                                class="story-uncertainty"
                                x-show="article.topStory?.conflicts?.length"
                                x-text="article.topStory?.feed?.endsWith('_vietnam') ? 'Thông tin còn sơ bộ hoặc có khác biệt giữa các nguồn; xem bài gốc để đối chiếu.' : 'Reporting is preliminary or differs between sources; consult the original reports.'">
                            </p>

                            <!-- Screenshot-style key fact cards -->
                            <div
                                class="story-key-facts"
                                x-show="storyKeyFacts(article).length">

                                <template
                                    x-for="fact in storyKeyFacts(article)"
                                    :key="fact.id">

                                    <div class="story-key-fact">
                                        <span
                                            class="story-key-fact-icon"
                                            aria-hidden="true">
                                            <span x-show="theme !== 'glass-light'" x-text="fact.icon"></span>
                                            <svg x-show="theme === 'glass-light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V11M10 19V5M16 19V8M22 19H2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                                        </span>

                                        <span class="story-key-fact-copy">
                                            <strong
                                                x-text="fact.value">
                                            </strong>

                                            <span
                                                x-show="fact.label"
                                                x-text="fact.label">
                                            </span>
                                        </span>
                                    </div>
                                </template>
                            </div>

                            <p
                                class="story-freshness"
                                role="status"
                                x-show="storyAnalysisNotice(article)"
                                x-text="storyAnalysisNotice(article)">
                            </p>

                            <!-- Screenshot-style analysis panel -->
                            <div
                                class="story-analysis-shell"
                                x-show="storyAnalysis(article).length">

                                <div
                                    class="story-analysis-tabs"
                                    role="tablist"
                                    aria-label="Story analysis">

                                    <button
                                        type="button"
                                        role="tab"
                                        x-show="storyAnalysisByLabel(article, 'Why it matters')"
                                        :aria-selected="activeStoryAnalysisLabel(article) === 'Why it matters'"
                                        :class="{ 'is-active': activeStoryAnalysisLabel(article) === 'Why it matters' }"
                                        @click.stop="toggleStoryAnalysis(article, 'Why it matters')">

                                        <svg
                                            viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <circle cx="12" cy="12" r="9"></circle>
                                            <path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3c-2.4 2.5-3.6 5.5-3.6 9S9.6 18.5 12 21"></path>
                                        </svg>

                                        <span
        x-text="storyAnalysisDisplayLabel(article, 'Why it matters')">
    </span>
                                    </button>

                                    <button
                                        type="button"
                                        role="tab"
                                        x-show="storyAnalysisByLabel(article, 'What changed')"
                                        :aria-selected="activeStoryAnalysisLabel(article) === 'What changed'"
                                        :class="{ 'is-active': activeStoryAnalysisLabel(article) === 'What changed' }"
                                        @click.stop="toggleStoryAnalysis(article, 'What changed')">

                                        <svg
                                            viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <path d="M4 7h13M13 3l4 4-4 4M20 17H7M11 13l-4 4 4 4"></path>
                                        </svg>

                                        <span
        x-text="storyAnalysisDisplayLabel(article, 'What changed')">
    </span>
                                    </button>

                                    <button
                                        type="button"
                                        role="tab"
                                        x-show="storyAnalysisByLabel(article, 'What to watch')"
                                        :aria-selected="activeStoryAnalysisLabel(article) === 'What to watch'"
                                        :class="{ 'is-active': activeStoryAnalysisLabel(article) === 'What to watch' }"
                                        @click.stop="toggleStoryAnalysis(article, 'What to watch')">

                                        <svg
                                            viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                                            <circle cx="12" cy="12" r="2.6"></circle>
                                        </svg>

                                        <span
        x-text="storyAnalysisDisplayLabel(article, 'What to watch')">
    </span>
                                    </button>

                                    <button
                                        type="button"
                                        role="tab"
                                        class="story-analysis-more-tab"
                                        x-show="storyExtraAnalysis(article).length"
                                        :aria-selected="storyMoreAnalysisActive(article)"
                                        :class="{ 'is-active': storyMoreAnalysisActive(article) }"
                                        @click.stop="openMoreStoryAnalysis(article)">

                                        <svg
                                            viewBox="0 0 24 24"
                                            aria-hidden="true">
                                            <path d="M4 19V13M10 19V9M16 19V5M22 19H2"></path>
                                        </svg>

                                        <span
                                            x-text="storyMoreAnalysisLabel(article, storyExtraAnalysis(article).length)">
                                        </span>
                                    </button>
                                </div>

                                <template
                                    x-if="activeStoryAnalysisSection(article)">

                                    <div class="story-analysis-body">

                                        <div
                                            class="story-more-analysis-rail"
                                            x-show="storyMoreAnalysisActive(article)">

                                            <template
                                                x-for="section in storyExtraAnalysis(article)"
                                                :key="section.label">

                                                <button
                                                    type="button"
                                                    :class="{ 'is-active': activeStoryAnalysisLabel(article) === section.label }"
                                                    @click.stop="toggleStoryAnalysis(article, section.label)"
                                                    x-text="storyAnalysisDisplayLabel(article, section.label)">
                                                </button>
                                            </template>
                                        </div>

                                        <div class="story-analysis-copy">

                                            <div class="story-analysis-text">
                                                <div
                                                    class="story-analysis-section-label"
                                                    x-show="storyMoreAnalysisActive(article)"
                                                    x-text="storyAnalysisDisplayLabel(
        article,
        activeStoryAnalysisSection(article)?.label || ''
    )">
                                                </div>

                                                <p
                                                    x-show="activeStoryAnalysisSection(article)?.text"
                                                    x-text="activeStoryAnalysisSection(article)?.text"
                                                    style="white-space: pre-line">
                                                </p>

                                                <template
                                                    x-for="development in (activeStoryAnalysisSection(article)?.timeline || [])"
                                                    :key="development.id">

                                                    <div class="story-timeline-event">
                                                        <time
                                                            x-text="formatVietnamDateTime(development.date)">
                                                        </time>

                                                        <p
                                                            x-text="development.text">
                                                        </p>

                                                        <div class="top-story-citations">
                                                            <template
                                                                x-for="source in development.sources"
                                                                :key="source.link">

                                                                <a
                                                                    :href="source.link"
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    x-text="source.name">
                                                                </a>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>

                                                <div class="top-story-citations">
                                                    <template
                                                        x-for="citation in uniqueCitations(activeStoryAnalysisSection(article)?.citations)"
                                                        :key="citation.link">

                                                        <a
                                                            :href="citation.link"
                                                            :title="citation.quote"
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            x-text="citation.name">
                                                        </a>
                                                    </template>
                                                </div>
                                            </div>

                                            <button
                                                type="button"
                                                class="story-analysis-next"
                                                x-show="storyAnalysis(article).length > 1"
                                                @click.stop="advanceStoryAnalysis(article)"
                                                aria-label="Next analysis section">

                                                <svg
                                                    viewBox="0 0 24 24"
                                                    aria-hidden="true">
                                                    <path d="m9 5 7 7-7 7"></path>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Only appears after pressing +N at top-right -->
                            <template
                                x-if="storyCoverageOpen[article.clusterId || article.link] && storyCoverage(article).length > 4">

                                <div class="story-coverage-expanded">
                                    <template
                                        x-for="publisher in storyCoverage(article).slice(4)"
                                        :key="publisher.identity">

                                        <div class="story-coverage-expanded-publisher">

                                            <div class="story-coverage-expanded-heading">
                                                <span class="story-coverage-expanded-icon">
                                                    <span
                                                        x-text="publisher.name?.slice(0, 1)?.toUpperCase() || '?'">
                                                    </span>

                                                    <img
                                                        x-show="publisher.icon"
                                                        :src="publisher.icon"
                                                        @error="$el.style.display='none'"
                                                        referrerpolicy="no-referrer"
                                                        alt="">
                                                </span>

                                                <strong
                                                    x-text="publisher.name">
                                                </strong>
                                            </div>

                                            <template
                                                x-for="source in publisher.articles"
                                                :key="source.link">

                                                <a
                                                    :href="source.link"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    @click.stop
                                                    x-text="stripHtml(source.title)">
                                                </a>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        </div>
                        <!-- Action Buttons Overlay -->
                        </div>
                        </div>
