                    <!-- ═══ AI Summary Section ═══ -->

                                </div>

                            <!-- VOZ Progress -->
                            <template x-if="isVozArticle(overlayArticle) && vozSummaryProgress">

                                         : 'bg-purple-500/[0.04] border-purple-500/15 shadow-[0_2px_16px_rgba(0,0,0,0.12)]'"
                                    style="backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">

                                        <span class="text-sm font-bold tracking-tight"

                                        <button @click="cancelVozSummary(overlayArticle.originalLink || overlayArticle.link)"

                                </div>
                            </template>

                            <!-- Loading Skeleton -->
                            <template
                                x-if="aiSummary && ['pending', 'generating'].includes(aiSummary.status)">
                                <div class="ai-summary-card rounded-2xl p-5 border transition-all animate-pulse"

                                         ? 'bg-white/50 border-purple-200/40 shadow-[0_2px_16px_rgba(147,51,234,0.06)]'
                                         : 'bg-purple-500/[0.04] border-purple-500/15 shadow-[0_2px_16px_rgba(0,0,0,0.12)]'"
                                    style="backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">

                                        <span class="text-lg">✨</span>
                                        <span class="text-sm font-bold tracking-tight text-purple-700"

                                            :class="theme === 'glass-light' ? 'bg-purple-100' : 'bg-purple-800/20'">
                                        </div>

                                                    ✨ Upgraded
                                                </span>
                                            </template>
                                            <template x-if="aiSummary.modelUsed">
                                                <span
                                                    class="text-[10px] px-2 py-0.5 rounded-full font-medium ml-1 border flex items-center gap-1"
                                                    :class="aiSummary.modelUsed.includes('qwen')

                                                          : 'bg-violet-500/10 text-violet-400 border-violet-500/20'">

                                                        viewBox="0 0 24 24" fill="currentColor">
                                                        <path
                                                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5l-4.5 4.5 1-6 4.5-4.5v5l4.5-4.5-1 6-4.5 4.5z" />

                                                        <path

                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>

                                                    :class="theme === 'glass-light' ? 'text-gray-400 hover:text-blue-500 hover:bg-blue-50' : 'text-gray-500 hover:text-blue-400 hover:bg-blue-500/10'"
                                                    title="Export to PDF">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                                    </svg>
                                                </button>
                                            </template>
                                            <button

                                                        ? 'text-emerald-500 bg-emerald-500/10'
                                                        : (theme === 'glass-light' ? 'text-gray-400 hover:text-emerald-500 hover:bg-emerald-50' : 'text-gray-500 hover:text-emerald-400 hover:bg-emerald-500/10')"
                                                title="Good summary">
                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor"
                                                    stroke-width="2" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z">
                                                    </path>
                                                </svg>
                                            </button>
                                            <button
                                                @click="submitSummaryFeedback(overlayArticle.originalLink || overlayArticle.link, aiSummary.feedback === 'down' ? null : 'down')"
                                                class="p-1.5 rounded-lg transition-all active:scale-90"
                                                :class="aiSummary.feedback === 'down'
                                                        ? 'text-red-500 bg-red-500/10'
                                                        : (theme === 'glass-light' ? 'text-gray-400 hover:text-red-500 hover:bg-red-50' : 'text-gray-500 hover:text-red-400 hover:bg-red-500/10')"

                                                    stroke-width="2" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z">
                                                    </path>
                                                </svg>
                                            </button>
                                        </div>
                                    </div>

                                                :class="theme === 'glass-light' ? 'text-gray-700' : 'text-gray-300'"

                                        </div>
                                    </template>

                                    <!-- VOZ Thread Stats -->
                                    <template x-if="aiSummary.isVozThread && aiSummary.totalPosts">
                                        <div class="px-5 pb-2">
                                            <span class="text-[10px] font-medium px-2 py-0.5 rounded-full"
                                                :class="theme === 'glass-light' ? 'bg-gray-100 text-gray-500' : 'bg-white/5 text-gray-500'"
                                                x-text="aiSummary.totalPosts + ' posts • ' + aiSummary.totalPages + ' pages'"></span>
                                        </div>
                                    </template>


                                    <!-- AI Analysis Section -->
                                    <template x-if="aiSummary && aiSummary.status === 'ready' && !aiSummary.analysis">
                                        <div
                                            class="mt-1 pt-4 border-t border-gray-100 dark:border-gray-700/50 flex justify-center pb-2">
                                            <button
                                                @click.stop="fetchAiAnalysis(overlayArticle.originalLink || overlayArticle.link)"

                                                class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold transition-all duration-300 active:scale-95 disabled:opacity-50"

                                                <span x-show="!aiAnalysisLoading">🔍</span>
                                                <svg x-show="aiAnalysisLoading"
                                                    class="animate-spin h-4 w-4 text-current"
                                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle class="opacity-25" cx="12" cy="12" r="10"
                                                        stroke="currentColor" stroke-width="4"></circle>
                                                    <path class="opacity-75" fill="currentColor"
                                                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                                    </path>
                                                </svg>
                                                <span
                                                    x-text="aiAnalysisLoading ? 'Generating Breakdown...' : 'Read Article Breakdown'"></span>
                                            </button>
                                        </div>
                                    </template>

                                    <template x-if="aiSummary && aiSummary.analysis">
                                        <div class="mx-5 mb-4 mt-2">
                                            <div class="flex items-center gap-2 mb-3">
                                                <span
                                                    class="font-bold tracking-widest text-[11px] drop-shadow-sm flex items-center gap-1"
                                                    :class="theme === 'glass-light' ? 'text-purple-700' : 'text-purple-300'">
                                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none"
                                                        stroke="currentColor" stroke-width="2">
                                                        <path stroke-linecap="round" stroke-linejoin="round"
                                                            d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z">
                                                        </path>
                                                    </svg>
                                                    ARTICLE BREAKDOWN
                                                </span>
                                                <template x-if="aiSummary.analysisModel">
                                                    <span
                                                        class="text-[10px] px-2 py-0.5 rounded flex items-center gap-1 font-medium"
                                                        :class="theme === 'glass-light' ? 'bg-blue-500/10 text-blue-600' : 'bg-blue-500/20 text-blue-400'">
                                                        <svg class="w-3 h-3 opacity-70" viewBox="0 0 24 24"
                                                            fill="currentColor">
                                                            <path
                                                                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                                                        </svg>
                                                        <span x-text="aiSummary.analysisModel"></span>
                                                    </span>
                                                </template>
                                            </div>
                                            <div class="text-[15px] leading-relaxed whitespace-pre-wrap font-medium"
                                                :class="theme === 'glass-light' ? 'text-gray-800' : 'text-gray-200'"
                                                x-html="formatText(aiSummary.analysis)"></div>
                                        </div>
                                    </template>

                                </div>
                            </template>
                        </div>
                    </template>
