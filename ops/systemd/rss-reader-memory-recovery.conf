[Service]
# Leave room below MemoryHigh for workers, native allocations and file I/O.
ExecStart=
ExecStart=/usr/bin/node --max-old-space-size=3072 --expose-gc /home/ubuntu/my-rss-reader/server.js
# Recover a blocked HTTP event loop without requiring a manual restart.
WatchdogSec=120s
WatchdogSignal=SIGKILL
NotifyAccess=all
